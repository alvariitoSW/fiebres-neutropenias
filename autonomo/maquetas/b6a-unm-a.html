<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <div id="leyenda"></div>

    <figure id="fig-hielo"><img src="../../js/modules/libros/img/mar-fig46-1-prueba-hielo.jpg" alt="Prueba del hielo positiva en la miastenia gravis: ptosis antes y después de 2 minutos de hielo"><figcaption>Fig. 46.1 · Prueba del hielo positiva (Marino 2024, p. 25). Se enciende con 2 minutos de hielo.</figcaption></figure>
