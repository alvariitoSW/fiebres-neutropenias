<!-- PROPUESTA PARA REVISAR (plan socialista, bloque 5). No es parte de la app.
     Ábrela con el servidor de la app: http://localhost:8000/autonomo/maquetas/b5-hepatocito-c.html
     Hepatocito, opción C «El paciente de la cama 4»: el enfermo entero con tres lupas (cabeza, hígado, abdomen). Mandos: función hepática,
     lactulosa, rifaximina, CVVH, fluido y TIPS. Fuente: Marino 2024, cap. 39 (docs/marino-2024-abdomen-temperatura-caps39-44.pdf).
     Sin librerías: SVG y JS puro. Reutiliza js/core/tope.js, frase-vista.js y particulas.js. Con «reducir movimiento» la mano queda quieta. -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>El paciente de la cama 4 · para revisar</title>
<link rel="stylesheet" href="b3-ritmo/base.css"><link rel="stylesheet" href="b5-hepatocito-c/estilo.css">
</head>
<body>
<main>
  <header class="cabecera"><div class="cab-fila"><h1>El paciente de la cama 4</h1></div><p class="aviso">Para revisar: aún no está en la app</p></header>
  <div class="modos" id="modos" role="group" aria-label="Modo"><button type="button" data-modo="explorar" aria-pressed="true">Explorar</button><button type="button" data-modo="apuesta" aria-pressed="false">Apuesta</button><button type="button" data-modo="error" aria-pressed="false">Error</button><button type="button" data-modo="caso" aria-pressed="false">Caso</button></div>
  <section id="prueba" class="prueba" hidden aria-live="polite"></section>
  <section id="monitor" aria-label="Monitor de cabecera">
    <div class="vit">PA <b id="mon-pa"></b> · FC <b id="mon-fc"></b></div>
    <div class="nh">NH₃ arterial <b id="mon-nh"></b> µmol/L <small>(normal &lt;60 · riesgo &gt;150 · ilustrativo)</small></div>
    <div class="vit">West Haven: <b id="mon-wh"></b></div>
  </section>
  <div class="selector-lupa" id="lupas" role="group" aria-label="Elige la lupa"></div>
  <section class="zona-escena"><svg id="esc" viewBox="0 0 360 360" role="img" aria-label="El paciente en la cama y la lupa elegida: cabeza, hígado o abdomen"></svg></section>
  <p id="idea" class="idea"></p>
  <section class="figuras" aria-label="Figura real del libro">
    <figure id="fig-cabeza"><img src="../../js/modules/libros/img/mar-fig39-2-tc-edema-cerebral.jpg" alt="TC de cráneo antes y después del edema cerebral en el fallo hepático agudo" width="663" height="451"><figcaption>Figura real: TC de cráneo antes (izquierda) y después (derecha) del edema cerebral: se borran los surcos. Marino, Fig. 39.2.</figcaption></figure>
    <figure id="fig-abdomen" hidden><img src="../../js/modules/libros/img/mar-fig39-3-varices-esofagicas.jpg" alt="Endoscopia con várices esofágicas" width="401" height="314"><figcaption>Figura real: várices esofágicas, venas engrosadas por la hipertensión portal. Marino, Fig. 39.3.</figcaption></figure>
  </section>
  <p class="fila-g"><button type="button" id="b-guia" class="b prim">Explícame a Hilario paso a paso</button></p>
  <section id="guia" class="prueba guia" hidden aria-live="polite"></section>
  <div id="leyenda"></div>
  <section class="bloque">
    <details class="plegable"><summary>Las fuentes de este modelo</summary><ul class="lista" id="fuentes"></ul></details>
    <details class="plegable"><summary>Lo que crecerá</summary><ul class="lista" id="crecera"></ul></details>
    <details class="plegable"><summary>Notas: lo que la fuente no dice, lo que discrepa</summary><div class="bloque" id="notas"></div></details>
    <details class="plegable"><summary>Para profundizar: lo que el modelo no enseña</summary><ul class="lista" id="profundizar"></ul></details>
  </section>
</main>
<p class="frase" id="frase" role="status" aria-live="polite"><span class="frase-txt" id="frase-txt"></span></p>
<div class="dock" id="dock"><div class="dock-in">
  <div class="dock-tabs" role="tablist" aria-label="Mandos"><button type="button" role="tab" data-pest="dar" aria-selected="true">Mandos</button><button type="button" role="tab" data-pest="medir" aria-selected="false">Paciente</button></div>
  <div class="dock-panel" id="dock-panel"></div><div class="dock-panel" id="dock-medir" hidden></div>
</div></div>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="b5-hepatocito-c/pagina.js"></script>
</body></html>
