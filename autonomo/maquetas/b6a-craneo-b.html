<!-- PROPUESTA PARA REVISAR (plan socialista, bloque 6a). No es parte de la app.
     Ábrela con el servidor de la app: http://localhost:8000/autonomo/maquetas/b6a-craneo-b.html
     Cráneo vivo, opción B «El corte con la cara»: corte coronal del cráneo (hemisferios, ventrículos, tienda, tronco, uncus) y, al lado,
     la cara y la mano del enfermo. Fuente: Marino 2024, caps. 45 y 47 (docs/marino-2024-neurologia-caps45-47.pdf).
     Reutiliza (importados) js/core/tope.js y js/core/frase-vista.js; copia cara y pupilas de la vista Visual con marca TODO. Sin librerías. -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cráneo vivo · el corte con la cara · para revisar</title>
<link rel="stylesheet" href="b3-ritmo/base.css"><link rel="stylesheet" href="b6a-craneo-b/estilo.css">
</head>
<body>
<main>
  <header class="cabecera"><div class="cab-fila"><h1>El corte con la cara</h1></div><p class="aviso">Para revisar: aún no está en la app</p></header>
  <div class="modos" id="modos" role="group" aria-label="Modo"><button type="button" data-modo="explorar" aria-pressed="true">Explorar</button><button type="button" data-modo="apuesta" aria-pressed="false">Apuesta</button><button type="button" data-modo="error" aria-pressed="false">Error</button><button type="button" data-modo="caso" aria-pressed="false">Caso</button></div>
  <section id="prueba" class="prueba" hidden aria-live="polite"></section>
  <p id="idea" class="idea"></p>
  <div class="presets" id="presets" role="group" aria-label="Paciente"></div>
  <section id="monitor" aria-label="Monitor de cabecera"><div class="mon-fila">
    <span>PA <b id="m-pa"></b></span><span>PAM <b id="m-pam"></b></span><span>PIC <b id="m-pic"></b></span><span>PPC <b id="m-ppc"></b></span><span>GCS <b id="m-gcs"></b></span><span>Na⁺ <b id="m-na"></b></span><span>Tiempo <b id="m-t"></b></span></div></section>
  <section class="zona-escena"><svg id="cr-svg" viewBox="0 0 390 330" role="img" aria-label="Corte coronal del cráneo y la cara del enfermo"></svg></section>
  <section id="guia" class="prueba guia" hidden aria-live="polite"></section>
  <figure class="fig"><img id="fig-img" alt="Imagen real del libro" loading="eager"><figcaption id="fig-cap"></figcaption></figure>
  <section class="bloque">
    <details class="plegable"><summary>Las fuentes de este modelo</summary><ul class="lista" id="fuentes"></ul></details>
    <details class="plegable"><summary>Lo que crecerá</summary><ul class="lista" id="crecera"></ul></details>
    <details class="plegable"><summary>Notas: lo que la fuente no dice, lo que discrepa</summary><div class="bloque" id="notas"></div></details>
    <details class="plegable"><summary>Para profundizar: lo que el modelo no enseña</summary><ul class="lista" id="profundizar"></ul></details>
  </section>
</main>
<p class="frase" id="frase" role="status" aria-live="polite"><span class="frase-txt" id="frase-txt"></span></p>
<div class="dock" id="dock"><div class="dock-in">
  <div class="dock-tabs" role="tablist" aria-label="Mandos"><button type="button" role="tab" data-pest="dar" aria-selected="true">Masa y sangrado</button><button type="button" role="tab" data-pest="medir" aria-selected="false">Presión y respirador</button></div>
  <div class="dock-panel" id="dock-panel"></div><div class="dock-panel" id="dock-medir" hidden></div>
</div></div>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="b6a-craneo-b/pagina.js"></script>
</body></html>
