<!-- PROPUESTA PARA ELEGIR (educacion-pionera, fase 3). No es parte de la app.
     Maqueta C · entrelazado y repaso espaciado en el río y mar: cinco preguntas de días atrás y el caso de Teresa
     (cristaloides cruzados con hemorragia clase II). Ábrela con el servidor de la app, desde la raíz del repositorio:
       python3 -m http.server 8000  →  http://localhost:8000/autonomo/maquetas/educacion/c-entrelazado-rio.html
     Usa el río y mar real (js/modules/libros/agua-viva-escena.js y js/data/agua-viva-data.js) y los estilos reales de
     la app. Contenido en c/datos.mjs y lógica en c/c.js. No guarda nada (ni localStorage ni sessionStorage): las
     fechas de «días atrás» son fijas (hoy = 04/11/2026).
     Fuentes: docs/marino-2024-fluidoterapia-caps10-11.pdf (F) y docs/marino-2024-shock-caps14-17.pdf (S); página del PDF.
     Teresa (45 años) es inventada; la medicina, del libro. -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrelazado y repaso: río y mar</title>
<link rel="stylesheet" href="../../../css/variables.css">
<link rel="stylesheet" href="../../../css/base.css">
<link rel="stylesheet" href="../../../css/components.css">
<style>
body { margin: 0; background: var(--bg-main); color: var(--text-main); font: 16px/1.5 Georgia, 'Times New Roman', serif;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px)); overflow-x: hidden; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
main > * { min-width: 0; }
[hidden] { display: none !important; }
.c-aviso-top { font: 600 .7rem/1.2 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--bg-main); background: var(--accent-yellow); border-radius: 6px; padding: 4px 8px; width: fit-content; }
h1 { font-size: 1.15rem; line-height: 1.2; margin: 0; color: var(--accent-yellow); font-weight: normal; }
h2 { font-size: 1.12rem; margin: 2px 0 4px; color: var(--accent-yellow); font-weight: normal; text-wrap: balance; }
h3 { font-size: 1rem; margin: 6px 0; font-weight: normal; }
p { margin: 0; }
.c-sans { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.c-eyebrow { font: 600 .72rem system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.c-leyenda, .c-para, .c-peq, .c-nota { font: .8rem/1.4 system-ui, sans-serif; color: var(--text-muted); }
.c-nota { margin: 0; }
.nota-plegable > summary { font-size: .8rem; }
.c-prog { display: flex; gap: 5px; }
.c-prog i { flex: 1; height: 5px; border-radius: 3px; background: rgba(46, 38, 28, 1); }
.c-prog i.on { background: var(--accent-yellow); }
.c-lead { color: var(--text-dim); font-size: .94rem; line-height: 1.4; }
.c-pant { display: grid; gap: 10px; min-width: 0; }
.c-pant > * { min-width: 0; }
.c-cabp { display: grid; gap: 4px; }
.c-preg { display: grid; gap: 10px; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 14px; padding: 12px; }
.c-preg > * { min-width: 0; }
.c-cab { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.c-chip { font: 600 .74rem/1.25 system-ui, sans-serif; color: var(--accent-yellow); border: 1px solid var(--accent-yellow); border-radius: 999px; padding: 2px 9px; }
.c-enun { font-size: 1.02rem; line-height: 1.4; }
.c-cuerpo, .c-fin, .c-puntos { display: grid; gap: 8px; }
.c-b { font: 600 .9rem system-ui, sans-serif; min-height: 44px; background: rgba(46, 38, 28, 1); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.c-b.c-prim { background: var(--accent-yellow); color: var(--bg-main); border-color: var(--accent-yellow); }
.c-b.c-sec { background: transparent; color: var(--accent-yellow); border-style: dashed; }
.c-opw { display: grid; gap: 4px; }
.c-op, .c-frase { display: flex; gap: 8px; width: 100%; min-height: 44px; text-align: left; align-items: flex-start; font: .96rem/1.4 Georgia, serif; background: transparent; color: var(--text-main); border: 1px solid rgba(196, 154, 74, .35); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
.c-op[aria-disabled], .c-frase[aria-disabled] { cursor: default; }
.c-frase .c-n { font: 700 .76rem system-ui, sans-serif; color: var(--text-muted); padding-top: 3px; }
.c-marcada { border-color: var(--accent-yellow); background: rgba(207, 154, 62, .12); }
.c-ok { border-color: var(--accent-green); border-width: 2px; }
.c-no { border-color: var(--accent-red); background: rgba(184, 92, 62, .12); }
.c-elegida { box-shadow: 0 0 0 2px var(--text-muted); }
.c-porque { font: .88rem/1.45 system-ui, sans-serif; color: var(--text-dim); padding: 0 4px; }
.c-corr { display: grid; gap: 6px; }
.c-punto { display: flex; gap: 10px; align-items: flex-start; font: .95rem/1.45 Georgia, serif; }
.c-punto input { margin-top: 4px; width: 20px; height: 20px; accent-color: var(--accent-green); flex: none; }
.c-veredicto { font: 700 .92rem system-ui, sans-serif; }
.c-vok { color: var(--accent-green); }
.c-vno { color: var(--accent-red); }
.c-expl { display: grid; gap: 6px; font-size: .95rem; line-height: 1.45; background: rgba(46, 38, 28, 1); border-radius: 10px; padding: 10px; }
.c-ver { font: .84rem/1.45 system-ui, sans-serif; color: var(--text-dim); }
.c-vuelve { font: 600 .86rem system-ui, sans-serif; color: var(--accent-yellow); }
.c-conf { font: .9rem/1.4 system-ui, sans-serif; color: var(--text-main); border-left: 3px solid var(--accent-yellow); padding-left: 9px; }
.c-paciente { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; background: rgba(46, 38, 28, 1); border-radius: 10px; padding: 10px; margin: 0; font: .86rem/1.4 system-ui, sans-serif; }
.c-paciente dt { color: var(--text-muted); }
.c-paciente dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.c-paciente dd.c-nuevo { color: var(--accent-red); font-weight: 600; }
.c-org { font: .72rem/1.25 system-ui, sans-serif; color: var(--text-muted); font-weight: 400; border: 1px dashed var(--border-color); border-radius: 999px; padding: 0 6px; white-space: normal; }
.c-calcw { display: grid; gap: 6px; }
.c-calc { display: grid; gap: 4px; font: .88rem/1.4 system-ui, sans-serif; background: rgba(46, 38, 28, 1); border-radius: 10px; padding: 10px; }
.c-lleva { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .96rem; line-height: 1.45; }
.c-fila { display: grid; gap: 8px; }
.c-tabla { overflow-x: auto; }
.c-tabla td, .c-tabla th { font-size: .82rem; }
.c-tabla small { color: var(--text-muted); }
.c-elige { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: grid; gap: 9px; font-family: system-ui, sans-serif; }
.c-abc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.c-abc a { display: grid; justify-items: center; min-height: 52px; align-content: center; border: 1px solid var(--border-color); border-radius: 10px; color: var(--accent-yellow); text-decoration: none; font: 700 1rem system-ui, sans-serif; padding: 4px; text-align: center; }
.c-abc a small { font: .74rem/1.2 system-ui, sans-serif; color: var(--text-muted); font-weight: 400; }
.c-abc a.c-aqui { background: var(--accent-yellow); color: var(--bg-main); }
.c-abc a.c-aqui small { color: var(--bg-main); }
.c-dia { display: grid; gap: 8px; }
#agv-formula { display: none !important; }
#agv-raiz.agv-raiz { padding-bottom: 0; position: sticky; top: 0; z-index: 6; background: var(--bg-main); }
#agv-raiz .agv-escena-bloque { position: static; box-shadow: none; padding: 4px 0 6px; box-shadow: 0 12px 14px -12px rgba(23, 20, 15, 1); }
.agv-raiz .agv-anillo { animation: c-pulso 1.4s ease-in-out infinite; }
@keyframes c-pulso { 0%, 100% { opacity: .95; } 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .agv-raiz .agv-anillo { animation: none; } }
</style>
</head><body>
<main>
  <span class="c-aviso-top">Propuesta C · no es la app</span>
  <h1>Entrelazar y repasar: río y mar</h1>
  <div class="c-prog" id="c-progreso" aria-hidden="true"></div>
  <p class="c-leyenda"><b id="c-nummero">Pantalla 1 de 6</b> · F = Fluidoterapia (Marino caps. 10-11) · S = Shock (caps. 14-17); páginas del PDF.</p>

  <!-- El río y mar real: los mismos ids que la ficha de la app -->
  <div class="agv-raiz agv-estudio" id="agv-raiz" hidden>
    <section class="agv-escena-bloque" id="agv-escena-bloque" aria-label="El estuario">
      <div class="agv-escena" id="agv-escena">
        <canvas id="agv-lienzo" role="img" aria-label="Río, marisma y mar: dónde acaba cada fluido"></canvas>
        <span class="agv-chapa">símil · ilustrativo</span>
        <div class="agv-lectura" id="agv-lectura" aria-live="off"></div>
        <div class="agv-lupa" id="agv-lupa" hidden>
          <canvas id="agv-lupa-lienzo" role="img" aria-label="Lupa"></canvas>
          <p class="agv-lupa-tit" id="agv-lupa-tit" hidden></p>
        </div>
        <button type="button" class="agv-lupa-cerrar" id="agv-lupa-cerrar" hidden aria-label="Cerrar la lupa">×</button>
        <div class="agv-anillo" id="agv-anillo" hidden></div>
      </div>
      <div class="agv-mareas" aria-live="off">
        <div class="agv-marea"><div class="agv-nom">Río<small>plasma</small></div><div class="agv-tot" id="agv-tot-rio">2.000 mL</div><div class="agv-dl" id="agv-dl-rio">±0</div><span class="agv-o" id="agv-org-rio"></span></div>
        <div class="agv-marea"><div class="agv-nom">Marisma<small>intersticio</small></div><div class="agv-tot" id="agv-tot-marisma">8.000 mL</div><div class="agv-dl" id="agv-dl-marisma">±0</div><span class="agv-o" id="agv-org-marisma"></span></div>
        <div class="agv-marea"><div class="agv-nom">Mar<small>células</small></div><div class="agv-tot" id="agv-tot-mar">20.000 mL</div><div class="agv-dl" id="agv-dl-mar">±0</div><span class="agv-o" id="agv-org-mar"></span></div>
      </div>
      <div class="fml" id="agv-formula" hidden aria-live="off"></div>
    </section>
  </div>

  <div id="c-pantalla"></div>
</main>
<script type="module" src="c/c.js"></script>
</body></html>
