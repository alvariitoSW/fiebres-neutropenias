            </g>

            <g data-segmento="asa-ascendente-gruesa">

                <path d="M133,150 q5,90 3,180" fill="none" stroke="var(--accent-blue)" stroke-width="4" stroke-linecap="round" />
                <path d="M136,330 q-8,10 -12,18 M136,330 q8,10 12,18" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" />
            </g>
        </svg>
        <p class="atlas-hint">Toca glomérulo, túbulos, asa de Henle o colector</p>
