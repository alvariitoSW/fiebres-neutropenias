<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUD Clínico UCI</title>
<link rel="stylesheet" href="css/variables.css?v=20260805-4">
<link rel="stylesheet" href="css/base.css?v=20260805-4">
<link rel="stylesheet" href="css/components.css?v=20260805-4">
</head>
<body>

<div class="app-container">
    <div class="header-row">
        <div class="header">
            <h1>HUD Clínico UCI</h1>
            <p>Estratificación de Riesgo // R1</p>
        </div>
        <button class="accordion-btn nav-btn corner-btn" id="btn-escalas-generales">⚡ Escalas</button>
    </div>

    <!-- ========================================== -->
    <!-- MENÚ DE ESPECIALIDADES (nivel raíz)         -->
    <!-- ========================================== -->
    <div id="especialidades-view">
        <div class="diag-header">
            <h2 style="color: var(--accent-blue); text-shadow: var(--glow-blue);">Especialidades</h2>
            <p>Selecciona un área clínica</p>
        </div>

        <button class="accordion-btn nav-btn" id="btn-hematologia" style="border-left: 4px solid var(--accent-red);">
            <span><span class="hemato-icon">🩸</span>HEMATOLOGÍA</span>
            <span style="font-size: 0.8rem; color: var(--accent-red);">[ VER → ]</span>
        </button>

        <button class="accordion-btn nav-btn" id="btn-nefrologia" style="border-left: 4px solid var(--accent-green);">
            <span><span class="gral-icon" style="color: var(--accent-green); text-shadow: var(--glow-green);">🫘</span>NEFROLOGÍA</span>
            <span style="font-size: 0.8rem; color: var(--accent-green);">[ VER → ]</span>
        </button>
    </div>

    <!-- ========================================== -->
    <!-- MENÚ PRINCIPAL — HEMATOLOGÍA                -->
    <!-- ========================================== -->
    <div id="home-view" style="display: none;">
        <button class="back-btn btn-volver-especialidades">← VOLVER</button>

        <!-- ===== ATLAS HEMATOLÓGICO: mapa interactivo de navegación ===== -->
        <div class="atlas-frame">
            <div class="stage" id="atlas-stage">

                <svg class="landscape" viewBox="0 0 400 620" aria-hidden="true">
                    <defs>
                        <linearGradient id="vesselGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#b85c3e" stop-opacity="0.7" />
                            <stop offset="45%" stop-color="#cf9a3e" stop-opacity="0.7" />
                            <stop offset="100%" stop-color="#9c5476" stop-opacity="0.7" />
                        </linearGradient>
                        <radialGradient id="blobRed"><stop offset="0%" stop-color="#b85c3e" stop-opacity="0.55"/><stop offset="100%" stop-color="#b85c3e" stop-opacity="0"/></radialGradient>
                        <radialGradient id="blobBlue"><stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/><stop offset="100%" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
                        <radialGradient id="blobYellow"><stop offset="0%" stop-color="#cf9a3e" stop-opacity="0.55"/><stop offset="100%" stop-color="#cf9a3e" stop-opacity="0"/></radialGradient>
                        <radialGradient id="blobPurple"><stop offset="0%" stop-color="#9c5476" stop-opacity="0.55"/><stop offset="100%" stop-color="#9c5476" stop-opacity="0"/></radialGradient>
                        <pattern id="atlasHatch" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                            <line x1="0" y1="0" x2="0" y2="16" stroke="#d4af37" stroke-opacity="0.05" stroke-width="1" />
                        </pattern>
                    </defs>
                    <rect x="0" y="0" width="400" height="620" fill="url(#atlasHatch)" />
                    <circle cx="88" cy="112" r="90" fill="url(#blobRed)" class="glow-blob" />
                    <circle cx="272" cy="212" r="95" fill="url(#blobBlue)" class="glow-blob" />
                    <circle cx="120" cy="348" r="100" fill="url(#blobYellow)" class="glow-blob" />
                    <circle cx="280" cy="484" r="95" fill="url(#blobPurple)" class="glow-blob" />
                    <path class="vessel-line" d="M88,112 C 160,150 210,170 272,212 C 320,250 90,300 120,348 C 150,395 340,420 280,484 C 250,520 260,545 262,560" />
                </svg>

                <!-- NIVEL 0: mapa general -->
                <div class="atlas-screen active" id="atlas-screen-overview">
                    <button class="region-btn" style="left:22%; top:18%;" data-zone="citopenias">
                        <div class="region-orb" style="--orb-color:var(--accent-red); --orb-glow:rgba(184,92,62,0.5);">
                            <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="#fff" stroke-opacity="0.5"/><circle cx="14" cy="16" r="4" fill="#fff"/><circle cx="25" cy="14" r="3" fill="#fff" opacity="0.8"/><circle cx="22" cy="25" r="3.5" fill="#fff" opacity="0.9"/></svg>
                        </div>
                        <span class="region-label">Manejo<br>Citopenias</span>
                        <span class="region-visited"></span>
                    </button>

                    <button class="region-btn" style="left:68%; top:34%;" data-route="reconocimiento">
                        <div class="region-orb" style="--orb-color:var(--accent-blue); --orb-glow:rgba(212,175,55,0.5);">
                            <svg viewBox="0 0 40 40"><circle cx="15" cy="20" r="9" fill="none" stroke="#fff" stroke-opacity="0.7"/><circle cx="25" cy="20" r="9" fill="none" stroke="#fff" stroke-opacity="0.7"/><line x1="20" y1="10" x2="20" y2="20" stroke="#fff"/></svg>
                        </div>
                        <span class="region-label">Reconocimiento<br>Temprano</span>
                        <span class="region-visited"></span>
                    </button>

                    <button class="region-btn" style="left:30%; top:56%;" data-zone="sindromes">
                        <div class="region-orb" style="--orb-color:var(--accent-yellow); --orb-glow:rgba(207,154,62,0.5);">
                            <svg viewBox="0 0 40 40"><polygon points="20,7 33,30 7,30" fill="none" stroke="#fff" stroke-opacity="0.7"/><line x1="20" y1="16" x2="20" y2="23" stroke="#fff" stroke-width="2"/><circle cx="20" cy="27" r="1.4" fill="#fff"/></svg>
                        </div>
                        <span class="region-label">Síndromes<br>Urgentes</span>
                        <span class="region-visited"></span>
                    </button>

                    <button class="region-btn" style="left:70%; top:78%;" data-zone="trasplante">
                        <div class="region-orb" style="--orb-color:var(--accent-purple); --orb-glow:rgba(156,84,118,0.5);">
                            <svg viewBox="0 0 40 40"><path d="M14,30 C14,20 26,20 26,10" fill="none" stroke="#fff" stroke-opacity="0.75" stroke-width="2"/><path d="M14,24 C14,16 26,16 26,8" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2"/><circle cx="20" cy="32" r="2.5" fill="#fff"/></svg>
                        </div>
                        <span class="region-label">Trasplante<br>TPH</span>
                        <span class="region-visited"></span>
                    </button>
                </div>

                <!-- NIVEL 1: zona Citopenias -->
                <div class="atlas-screen" id="atlas-screen-citopenias">
                    <div class="level-head"><button class="back-chip" data-back="atlas-screen-overview">← Mapa</button><span class="crumb">Hematología / <strong>Citopenias</strong></span></div>
                    <button class="region-btn node-sm" style="left:50%; top:50%;" data-route="citopenias-neutropenia">
                        <div class="region-orb" style="--orb-color:var(--accent-red); --orb-glow:rgba(184,92,62,0.5);">
                            <svg viewBox="0 0 40 40"><path d="M20,8 C12,20 12,28 20,32 C28,28 28,20 20,8 Z" fill="#fff" opacity="0.85"/></svg>
                        </div>
                        <span class="region-label">Neutropenia<br>Febril</span>
                        <span class="region-visited"></span>
                    </button>
                </div>

                <!-- NIVEL 1: zona Síndromes Urgentes -->
                <div class="atlas-screen" id="atlas-screen-sindromes">
                    <div class="level-head"><button class="back-chip" data-back="atlas-screen-overview">← Mapa</button><span class="crumb">Hematología / <strong>Síndromes Urgentes</strong></span></div>
                    <button class="region-btn node-sm" style="left:26%; top:42%;" data-route="sindromes-cid">
                        <div class="region-orb" style="--orb-color:var(--accent-yellow); --orb-glow:rgba(207,154,62,0.5);">
                            <svg viewBox="0 0 40 40"><line x1="6" y1="14" x2="34" y2="14" stroke="#fff" stroke-width="2"/><line x1="6" y1="26" x2="34" y2="26" stroke="#fff" stroke-width="2"/><circle cx="20" cy="20" r="6" fill="#fff" opacity="0.85"/></svg>
                        </div>
                        <span class="region-label">CID</span>
                        <span class="region-visited"></span>
                    </button>
                    <button class="region-btn node-sm" style="left:70%; top:42%;" data-route="sindromes-ptt">
                        <div class="region-orb" style="--orb-color:var(--accent-yellow); --orb-glow:rgba(207,154,62,0.5);">
                            <svg viewBox="0 0 40 40"><line x1="6" y1="20" x2="34" y2="20" stroke="#fff" stroke-width="2"/><circle cx="17" cy="20" r="5" fill="#fff" opacity="0.85"/><circle cx="27" cy="14" r="2" fill="#fff" opacity="0.6"/></svg>
                        </div>
                        <span class="region-label">PTT</span>
                        <span class="region-visited"></span>
                    </button>
                    <button class="region-btn node-sm" style="left:48%; top:70%;" data-route="sindromes-slt">
                        <div class="region-orb" style="--orb-color:var(--accent-yellow); --orb-glow:rgba(207,154,62,0.5);">
                            <svg viewBox="0 0 40 40"><circle cx="20" cy="12" r="4" fill="#fff"/><line x1="20" y1="16" x2="20" y2="22" stroke="#fff" stroke-width="2"/><circle cx="20" cy="26" r="4" fill="#fff" opacity="0.6"/><line x1="20" y1="30" x2="20" y2="34" stroke="#fff" stroke-width="2"/></svg>
                        </div>
                        <span class="region-label">S. Lisis<br>Tumoral</span>
                        <span class="region-visited"></span>
                    </button>
                </div>

                <!-- NIVEL 1: zona Trasplante -->
                <div class="atlas-screen" id="atlas-screen-trasplante">
                    <div class="level-head"><button class="back-chip" data-back="atlas-screen-overview">← Mapa</button><span class="crumb">Hematología / <strong>Trasplante</strong></span></div>
                    <button class="region-btn node-sm" style="left:26%; top:40%;" data-route="trasplante-intro">
                        <div class="region-orb" style="--orb-color:var(--accent-purple); --orb-glow:rgba(156,84,118,0.5);"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="none" stroke="#fff" stroke-opacity="0.7"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg></div>
                        <span class="region-label">Introducción</span>
                        <span class="region-visited"></span>
                    </button>
                    <button class="region-btn node-sm" style="left:70%; top:40%;" data-route="trasplante-cart">
                        <div class="region-orb" style="--orb-color:var(--accent-purple); --orb-glow:rgba(156,84,118,0.5);"><svg viewBox="0 0 40 40"><path d="M12,28 L20,12 L28,28 Z" fill="none" stroke="#fff" stroke-opacity="0.7"/><circle cx="20" cy="22" r="2.4" fill="#fff"/></svg></div>
                        <span class="region-label">CAR-T</span>
                        <span class="region-visited"></span>
                    </button>
                    <button class="region-btn node-sm" style="left:48%; top:68%;" data-route="trasplante-complicaciones">
                        <div class="region-orb" style="--orb-color:var(--accent-purple); --orb-glow:rgba(156,84,118,0.5);"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="none" stroke="#fff" stroke-opacity="0.7"/><line x1="20" y1="13" x2="20" y2="21" stroke="#fff" stroke-width="2"/><circle cx="20" cy="25" r="1.4" fill="#fff"/></svg></div>
                        <span class="region-label">Complicaciones<br>post-TPH</span>
                        <span class="region-visited"></span>
                    </button>
                </div>

                <button class="compass" id="atlas-compass" title="Escalas Generales">⚡</button>
            </div>
        </div>
        <p class="atlas-hint">Toca una región para explorarla</p>

        <!-- SECCIÓN: FUENTES Y EVIDENCIA -->
        <button class="accordion-btn" data-target="fuentes" style="border-left: 4px solid var(--accent-green); margin-top: 20px;">
            <span><span class="gral-icon" style="color: var(--accent-green); text-shadow: var(--glow-green);">📚</span>FUENTES Y EVIDENCIA</span>
            <span id="fuentes-status" style="font-size: 0.8rem; color: var(--accent-green);">[ ABRIR ]</span>
        </button>
        <div id="fuentes" class="accordion-content" data-include="js/modules/fuentes/fuentes.html"></div>
    </div>

    <!-- ========================================== -->
    <!-- VISTA: ESCALAS GENERALES                    -->
    <!-- ========================================== -->
    <div id="escalas-generales-view" style="display: none;" data-include="js/modules/generales/generales.html"></div>

    <!-- ========================================== -->
    <!-- VISTA: MANEJO CITOPENIAS                    -->
    <!-- ========================================== -->
    <div id="citopenias-view" style="display: none;">
        <div id="citopenias-menu-view" data-include="js/modules/citopenias/citopenias-menu.html"></div>

        <div id="neutropenia-febril-container" style="display: none;">
            <div id="hemato-main-view" data-include="js/modules/neutropenia-febril/main-view.html"></div>
            <div id="hemato-diagnostico-view" style="display: none;" data-include="js/modules/neutropenia-febril/diagnostico-view.html"></div>
            <div id="hemato-tratamiento-view" style="display: none;" data-include="js/modules/neutropenia-febril/tratamiento-empirico-view.html"></div>
            <div id="hemato-dirigido-view" style="display: none;" data-include="js/modules/neutropenia-febril/tratamiento-dirigido-view.html"></div>
            <div id="hemato-microorganismos-view" style="display: none;" data-include="js/modules/neutropenia-febril/microorganismos-view.html"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VISTA: RECONOCIMIENTO TEMPRANO              -->
    <!-- ========================================== -->
    <div id="reconocimiento-view" style="display: none;" data-include="js/modules/reconocimiento/reconocimiento.html"></div>

    <!-- ========================================== -->
    <!-- VISTA: SÍNDROMES HEMATOLÓGICOS URGENTES     -->
    <!-- ========================================== -->
    <div id="sindromes-view" style="display: none;" data-include="js/modules/sindromes-urgentes/sindromes.html"></div>

    <!-- ========================================== -->
    <!-- VISTA: TRASPLANTE DE PROGENITORES           -->
    <!-- ========================================== -->
    <div id="trasplante-view" style="display: none;">
        <div id="trasplante-menu-view" data-include="js/modules/trasplante/trasplante-menu.html"></div>
        <div id="tph-intro-view" style="display: none;" data-include="js/modules/trasplante/introduccion.html"></div>
        <div id="tph-cart-view" style="display: none;" data-include="js/modules/trasplante/car-t.html"></div>
        <div id="tph-complicaciones-view" style="display: none;" data-include="js/modules/trasplante/complicaciones.html"></div>
    </div>

    <!-- ========================================== -->
    <!-- VISTA: NEFROLOGÍA                           -->
    <!-- ========================================== -->
    <div id="nefrologia-view" style="display: none;">
        <div id="nefro-menu-view" data-include="js/modules/nefrologia/nefro-menu.html"></div>
        <div id="nefro-diureticos-asa-view" style="display: none;" data-include="js/modules/nefrologia/diureticos-asa.html"></div>
    </div>
    <div data-include="js/modules/quiz/quiz.html"></div>
</div>

<script type="module" src="js/main.js?v=20260805-4"></script>
</body>
</html>
